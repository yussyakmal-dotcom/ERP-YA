<text x="123" y="675" font-family="DejaVu Sans" font-size="11" font-weight="400" fill="#A74E2F" text-anchor="start">Jika sumber fisik tidak jelas, minta konfirmasi petugas toko. Sistem tidak menebak dari saldo yang minus.</text>
