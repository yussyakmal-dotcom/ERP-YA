<text x="1158" y="242" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#243E35" text-anchor="start">Pilihan eksplisit</text>
<text x="1114" y="275" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">Kasir memilih berdasarkan asal barang fisik.</text>
<text x="1114" y="294" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">Jangan otomatis mengubah owned menjadi</text>
<text x="1114" y="313" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">titipan ketika stok terlihat habis.</text>
<rect x="1114" y="345" width="35.916015625" height="25" rx="12" fill="#EAF1EB" stroke="#EAF1EB" stroke-width="0.8"/>
<text x="1125" y="362" font-family="DejaVu Sans" font-size="10" font-weight="700" fill="#346B50" text-anchor="start">02</text>
<text x="1158" y="362" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#243E35" text-anchor="start">Owned dari SO batal</text>
<text x="1114" y="395" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">Barang ini sudah diakui saat penerimaan PO.</text>
<text x="1114" y="414" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">Penjualan hanya mengurangi stok dan</text>
<text x="1114" y="433" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">mencatat penjualan; tidak membentuk utang</text>
<text x="1114" y="452" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">supplier baru.</text>
<rect x="1114" y="484" width="35.916015625" height="25" rx="12" fill="#EAF1EB" stroke="#EAF1EB" stroke-width="0.8"/>
<text x="1125" y="501" font-family="DejaVu Sans" font-size="10" font-weight="700" fill="#346B50" text-anchor="start">03</text>
<text x="1158" y="501" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#243E35" text-anchor="start">Titipan</text>
<text x="1114" y="534" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">Sistem mencatat masuk dan terjual</text>
<text x="1114" y="553" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">bersamaan. Jika perjanjian/harga supplier tidak</text>
<text x="1114" y="572" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">tersedia lokal, pilihan titipan dinonaktifkan</text>
<text x="1114" y="591" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">dengan alasan.</text>
