<text x="1114" y="275" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">Tampilkan tindakan, nilai, alasan, kasir, nomor</text>
<text x="1114" y="294" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">struk/draft, dan versi kebijakan. PIN tidak</text>
