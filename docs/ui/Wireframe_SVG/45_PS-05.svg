<text x="213" y="672.0" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#A74E2F" text-anchor="start">Jika aturan atau akun kedaluwarsa, tindakan ditunda. Tidak ada jalan pintas tanpa bukti otorisasi.</text>
