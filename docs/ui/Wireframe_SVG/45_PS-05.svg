<text x="238" y="396" font-family="DejaVu Sans" font-size="11" font-weight="400" fill="#A74E2F" text-anchor="start">Contoh: diskon khusus Rp3.000 untuk keranjang Rp30.000. Persetujuan hanya berlaku untuk tindakan ini.</text>
