<text x="1114" y="395" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">Supervisor yang hadir menggunakan akun/PIN</text>
<text x="1114" y="414" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#24342F" text-anchor="start">tersinkron. Catat identitas, terminal, waktu dan</text>
