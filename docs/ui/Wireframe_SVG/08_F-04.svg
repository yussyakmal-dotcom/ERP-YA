<text x="1114" y="299" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Pengeluaran bahan strict non-minus.</text>
<text x="1114" y="321" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Kekurangan satu bahan membatalkan start</text>
