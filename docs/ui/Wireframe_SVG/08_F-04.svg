<text x="1114" y="561" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Empat keluaran adalah input form</text>
<text x="1114" y="583" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">penyelesaian, diposting atomik saat</text>
