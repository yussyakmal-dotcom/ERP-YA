<text x="1114" y="269" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#346B50" text-anchor="start">01</text>
<text x="1114" y="299" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Tidak mengirim saldo lokal untuk menimpa</text>
<text x="1114" y="321" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">saldo cloud. Stok dua terminal mungkin</text>
<text x="1114" y="343" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">berbeda saat offline; POS boleh minus</text>
<text x="1114" y="365" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">dengan penanda.</text>
<text x="1114" y="422" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#346B50" text-anchor="start">02</text>
<text x="1114" y="452" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Retry memakai identitas event yang sama.</text>
<text x="1114" y="474" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">ACK hilang tidak boleh menghasilkan</text>
<text x="1114" y="496" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">penjualan dan jurnal ganda.</text>
<text x="1114" y="553" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#346B50" text-anchor="start">03</text>
<text x="1114" y="583" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Antrean tidak dibuang saat restart atau</text>
<text x="1114" y="605" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">error. Tindakan diskon, batal, dan refund</text>
<text x="1114" y="627" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">offline memakai persetujuan supervisor</text>
<text x="1114" y="649" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">yang valid.</text>
