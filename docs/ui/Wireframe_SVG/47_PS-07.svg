<text x="103" y="668" font-family="DejaVu Sans" font-size="11" font-weight="400" fill="#A74E2F" text-anchor="start">Pembayaran non-tunai tidak masuk hitungan kas fisik. Tutup shift offline tetap menyimpan laporan dan antrean lokal.</text>
