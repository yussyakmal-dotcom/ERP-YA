<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F6F3EB" stroke="#F6F3EB" stroke-width="0.8"/>
<text x="38" y="42" font-family="DejaVu Sans" font-size="13" font-weight="700" fill="#243E35" text-anchor="start">YUSSY AKMAL</text>
<text x="1402" y="42" font-family="DejaVu Sans" font-size="10" font-weight="400" fill="#63756D" text-anchor="end">DESAIN UI / V1.0</text>
<line x1="38" y1="57" x2="1402" y2="57" stroke="#D8E1D9" stroke-width="1"/>
<text x="38" y="110" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#243E35" text-anchor="start">Sistem tampilan dan aturan bersama</text>
<text x="38" y="145" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#63756D" text-anchor="start">Rancangan visual awal untuk desktop operasional dan layar sentuh kasir.</text>
<rect x="38" y="194" width="412" height="657" rx="10" fill="#FFFFFF" stroke="#D8E1D9" stroke-width="0.8"/>
<rect x="512" y="194" width="412" height="657" rx="10" fill="#FFFFFF" stroke="#D8E1D9" stroke-width="0.8"/>
<rect x="986" y="194" width="416" height="657" rx="10" fill="#FFFFFF" stroke="#D8E1D9" stroke-width="0.8"/>
<text x="62" y="232" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#243E35" text-anchor="start">Bahasa visual</text>
<rect x="62" y="262" width="39" height="39" rx="7" fill="#346B50" stroke="#346B50" stroke-width="0.8"/>
<text x="118" y="287" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">Hijau / aksi utama</text>
<rect x="62" y="324" width="39" height="39" rx="7" fill="#F6F3EB" stroke="#F6F3EB" stroke-width="0.8"/>
<text x="118" y="349" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">Ivory / kanvas</text>
<rect x="62" y="386" width="39" height="39" rx="7" fill="#A74E2F" stroke="#A74E2F" stroke-width="0.8"/>
<text x="118" y="411" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">Jingga / perhatian</text>
<rect x="62" y="448" width="39" height="39" rx="7" fill="#A33934" stroke="#A33934" stroke-width="0.8"/>
<text x="118" y="473" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">Merah / gagal</text>
<text x="62" y="558" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#24342F" text-anchor="start">Arah visual usulan: hangat, rapi, dan mudah</text>
<text x="62" y="583" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#24342F" text-anchor="start">dibaca. Ini bukan penetapan logo atau warna</text>
<text x="62" y="608" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#24342F" text-anchor="start">merek resmi.</text>
<text x="62" y="685" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#63756D" text-anchor="start">Font sans-serif; angka uang rata kanan saat</text>
<text x="62" y="709" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#63756D" text-anchor="start">implementasi. Rupiah dan satuan ditampilkan</text>
<text x="62" y="733" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#63756D" text-anchor="start">eksplisit. Waktu tampil WIB.</text>
<text x="536" y="232" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#243E35" text-anchor="start">Interaksi konsisten</text>
<text x="536" y="285" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Satu aksi utama</text>
<text x="536" y="315" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">Aksi posting berada di kanan bawah. Tindakan berisiko</text>
<text x="536" y="336" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">menampilkan ringkasan dampak.</text>
<text x="536" y="417" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Label status jelas</text>
<text x="536" y="447" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">Draft, menunggu approval, posted, dan dibalik</text>
<text x="536" y="468" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">dibedakan dengan teks, bukan warna saja.</text>
<text x="536" y="549" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Ruang kerja lintas lokasi</text>
<text x="536" y="579" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">Toko/dapur menjadi filter. Hak tindakan tetap</text>
<text x="536" y="600" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">mengikuti peran dan tabel approval.</text>
<text x="536" y="681" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Snapshot dan audit</text>
<text x="536" y="711" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">Setiap dokumen menautkan riwayat, lampiran, revisi,</text>
<text x="536" y="732" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">dan dokumen sumber.</text>
<text x="1010" y="232" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#243E35" text-anchor="start">Ukuran dan aksesibilitas</text>
<text x="1010" y="280" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">Backoffice: desktop 1280 px ke atas. Sidebar dapat</text>
<text x="1010" y="303" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">dipadatkan pada tablet. Form mengikuti urutan</text>
<text x="1010" y="326" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">baca; tabel dapat digeser horizontal.</text>
<text x="1010" y="420" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">POS: target awal layar sentuh 1280 x 800 atau</text>
<text x="1010" y="443" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">lebih. Tombol produksi minimal 44 x 44 CSS px.</text>
<text x="1010" y="466" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">Kartu produk dan area pembayaran dibuat mudah</text>
<text x="1010" y="489" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">disentuh.</text>
<text x="1010" y="590" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">Implementasi wajib mendukung fokus keyboard,</text>
<text x="1010" y="613" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">label input, error per field, kontras yang diuji, dan</text>
<text x="1010" y="636" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#24342F" text-anchor="start">tombol nonaktif dengan alasan.</text>
<text x="1010" y="738" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">Gambar layar dalam dokumen diperkecil untuk review.</text>
<text x="1010" y="759" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#63756D" text-anchor="start">Ukuran render PDF bukan spesifikasi piksel aplikasi.</text>
<line x1="38" y1="950" x2="1402" y2="950" stroke="#D8E1D9" stroke-width="1"/>
<text x="38" y="976" font-family="DejaVu Sans" font-size="10" font-weight="400" fill="#63756D" text-anchor="start">ERP Yussy Akmal  /  25 Oktober 2026  /  Desain usulan, bukan aplikasi operasional</text>
<text x="1402" y="976" font-family="DejaVu Sans" font-size="10" font-weight="400" fill="#63756D" text-anchor="end">GUIDE  /  04</text>
</svg>