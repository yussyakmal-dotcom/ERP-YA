<text x="1114" y="229" font-family="DejaVu Sans" font-size="11" font-weight="700" fill="#A74E2F" text-anchor="start">ATURAN PENTING</text>
<text x="1114" y="269" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#346B50" text-anchor="start">01</text>
<text x="1114" y="299" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Hanya pilihan masih dalam perjalanan</text>
<text x="1114" y="321" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">yang tidak menyelesaikan kuantitas</text>
<text x="1114" y="343" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">transit. Catat PIC dan tenggat</text>
<text x="1114" y="365" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">pemeriksaan.</text>
<text x="1114" y="422" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#346B50" text-anchor="start">02</text>
<text x="1114" y="452" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Barang kembali dipindahkan ke packing</text>
<text x="1114" y="474" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">setelah tiba; rusak/hilang mengurangi</text>
<text x="1114" y="496" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">transit lewat approval.</text>
<text x="1114" y="553" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#346B50" text-anchor="start">03</text>
<text x="1114" y="583" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Kesalahan jumlah kirim memulihkan</text>
<text x="1114" y="605" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">sumber hanya bila barang memang tidak</text>
<text x="1114" y="627" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">berangkat. Jumlah seluruh resolusi tidak</text>
<text x="1114" y="649" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">boleh melebihi sisa.</text>
