<text x="56" y="437" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Jumlah terima 11 melebihi pesanan 10 dus.</text>
<text x="56" y="482" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#63756D" text-anchor="start">Sorot field, pertahankan input lain, jelaskan batas yang benar.</text>
