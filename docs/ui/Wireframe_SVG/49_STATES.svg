<text x="751" y="263" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Memuat penerimaan dan saldo stok...</text>
<text x="751" y="308" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#63756D" text-anchor="start">Jangan menampilkan angka nol sementara seolah saldo final.</text>
