<rect x="751" y="387" width="113.4697265625" height="25" rx="12" fill="#EAF1EB" stroke="#EAF1EB" stroke-width="0.8"/>
<text x="762" y="404" font-family="DejaVu Sans" font-size="10" font-weight="700" fill="#346B50" text-anchor="start">Hak tidak cukup</text>
<text x="751" y="437" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Anda belum memiliki hak posting penerimaan.</text>
<text x="751" y="482" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#63756D" text-anchor="start">Jelaskan aksi yang dibatasi; jangan menyembunyikan dokumen seluruhnya.</text>
