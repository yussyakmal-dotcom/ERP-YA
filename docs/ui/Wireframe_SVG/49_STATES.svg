<text x="751" y="611" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Menyimpan penjualan lokal...</text>
<text x="751" y="656" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#63756D" text-anchor="start">Kunci tombol yang sama sampai hasil diketahui. Retry memakai ID sama.</text>
