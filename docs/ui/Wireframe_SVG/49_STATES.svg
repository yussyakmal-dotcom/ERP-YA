<text x="56" y="785" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Struk tersimpan lokal; menunggu sinkronisasi.</text>
<text x="56" y="830" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#63756D" text-anchor="start">Kasir dapat melanjutkan. Jangan menyatakan telah diterima cloud.</text>
