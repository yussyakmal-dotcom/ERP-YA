<text x="56" y="263" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Belum ada SO pada filter ini.</text>
<text x="56" y="308" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#63756D" text-anchor="start">Tampilkan Ubah filter atau Buat SO sesuai hak.</text>
