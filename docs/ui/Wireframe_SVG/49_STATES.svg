<text x="56" y="611" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Dokumen telah direvisi oleh petugas lain.</text>
<text x="56" y="656" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#63756D" text-anchor="start">Muat ulang versi terbaru sebelum mengajukan atau posting.</text>
