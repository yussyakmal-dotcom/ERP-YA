<rect x="751" y="735" width="144.294921875" height="25" rx="12" fill="#EAF1EB" stroke="#EAF1EB" stroke-width="0.8"/>
<text x="762" y="752" font-family="DejaVu Sans" font-size="10" font-weight="700" fill="#346B50" text-anchor="start">Gagal / perlu tinjauan</text>
<text x="751" y="785" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#243E35" text-anchor="start">Transaksi tersimpan, tetapi perlu tinjauan sinkronisasi.</text>
<text x="751" y="830" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#63756D" text-anchor="start">Jangan hapus antrean. Tampilkan rincian dan pemilik tindak lanjut.</text>
