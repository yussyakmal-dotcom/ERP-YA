<text x="1114" y="531" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#346B50" text-anchor="start">03</text>
<text x="1114" y="561" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#24342F" text-anchor="start">Retur tidak selalu langsung refund; boleh</text>
